name: publish

# Pushing a tag vX.Y.Z publishes that version to PyPI.
# Running the workflow by hand (Actions → publish → Run workflow) publishes to TestPyPI, as a dry run.
# Both use trusted publishing: PyPI / TestPyPI trust this workflow, so no API token is stored.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the package metadata
        run: uvx twine check dist/*

      # The tests run against the built wheel, not the source folder, so a file missing
      # from the package (example data, the tutorial, schemas) fails here, not for users.
      - name: Test the built package
        run: |
          uv venv --python 3.11
          uv pip install "$(ls dist/*.whl)[dev,viz]"
          uv run --no-sync pytest -q tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can be uploaded only once; reruns of the dry run skip it.
          skip-existing: true

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
