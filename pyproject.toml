[project]
name = "mfethuls"
version = "0.5.1"
description = "From scattered instrument files to analysis-ready data: a Python framework and app that read, clean and organise experimental lab data."
authors = [{name = "Luca Bertossi", email = "lucabertossi@gmail.com"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["laboratory", "instrument data", "ETL", "data management", "DSC", "TGA", "FTIR", "UV-Vis", "rheology", "materials science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "defusedxml>=0.7.1",  # openpyxl uses it to read .xlsx files safely
    "duckdb>=1.0.0",
    "filelock>=3.12",
    "nmrglue>=0.11",
    "numpy>=1.24.2",
    "openpyxl>=3.1.0",
    "pandas>=1.5.3",
    "pyarrow>=20.0.0",
    "python-dateutil>=2.8.2",  # time zones of instrument dates
    "python-dotenv>=1.0.0",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
notebook = [
    "marimo>=0.9.0",
    "matplotlib>=3.10.1",
    "plotly>=6.0.0",
    "seaborn>=0.13.0",
]
viz = [
    "matplotlib>=3.10.1",
    "kaleido>=1.0.0",
    "plotly>=6.0.0",
    "streamlit>=1.36.0",
]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", "__marimo__"]

[tool.ruff.lint]
# Errors only (syntax, undefined names, unused imports); no style rules.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mfethuls = ["py.typed"]
"mfethuls.config" = ["*.json", "schemas/*.json", "readers/*.json"]
"mfethuls.examples" = ["experiments_registry.csv", "data/**/*"]
"mfethuls.tutorials" = ["*.py"]

[build-system]
requires = ["setuptools>=77.0"]  # SPDX license expression and license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/lucaAyt/mfethuls"
Documentation = "https://github.com/lucaAyt/mfethuls/tree/master/docs"
Repository = "https://github.com/lucaAyt/mfethuls"
Issues = "https://github.com/lucaAyt/mfethuls/issues"
Changelog = "https://github.com/lucaAyt/mfethuls/releases"

[project.scripts]
mfethuls = "mfethuls.cli:main"
mfethuls-app = "mfethuls.app.launch:main"
mfethuls-tutorial = "mfethuls.tutorials:main"
