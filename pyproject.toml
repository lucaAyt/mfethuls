[project]
name = "mfethuls"
version = "0.2.0"
description = "Composable framework for lab instrument data parsing, characterization and analysis for python people in labs."
authors = [{name = "Luca Bertossi", email = "lucabertossi@gmail.com"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "filelock>=3.12",
    "nmrglue>=0.11",
    "numpy>=1.24.2",
    "openpyxl>=3.1.0",
    "pandas>=1.5.3",
    "pyarrow>=20.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
notebook = [
    "notebook>=6.5.3",
    "marimo>=0.9.0",
    "matplotlib>=3.10.1",
    "plotly>=6.0.0",
    "seaborn>=0.13.0",
]
viz = [
    "matplotlib>=3.10.1",
    "kaleido>=1.0.0",
    "plotly>=6.0.0",
    "streamlit>=1.36.0",
]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", "__marimo__"]

[tool.ruff.lint]
# Errors only (syntax, undefined names, unused imports); no style rules.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mfethuls = ["py.typed"]
"mfethuls.config" = ["*.json", "schemas/*.json"]
"mfethuls.examples" = ["experiments_registry.csv", "data/**/*"]
"mfethuls.tutorials" = ["*.py"]

[build-system]
requires = ["setuptools>=77.0"]  # SPDX license expression and license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project.scripts]
mfethuls = "mfethuls.main:main"
mfethuls-app = "mfethuls.app.launch:main"
mfethuls-tutorial = "mfethuls.tutorials:main"
